<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cập Nhật Hồ Sơ Chi Tiết - EduOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4 font-sans flex items-center justify-center">

  <!-- MÀN HÌNH ĐĂNG NHẬP (Giữ nguyên) -->
  <div id="hsLoginBox" class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-slate-100">
    <div class="text-center mb-6">
      <div class="w-14 h-14 bg-sky-100 text-sky-600 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-3 shadow-inner">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2 class="text-xl font-bold text-slate-800">CỔNG ĐĂNG NHẬP HỌC SINH</h2>
      <p class="text-xs text-slate-500 mt-1">Nhập Số Căn cước và Mật khẩu của bạn</p>
    </div>
    <form onsubmit="event.preventDefault(); loginStudent();" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Số Căn cước (CCCD)</label>
        <input type="text" id="loginCCCD" required placeholder="Nhập số CCCD" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-mono">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Mật khẩu</label>
        <input type="password" id="loginPass" required placeholder="Nhập mật khẩu" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm">
      </div>
      <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 rounded-xl text-sm shadow-lg shadow-sky-600/30 transition">
        ĐĂNG NHẬP HỆ THỐNG
      </button>
    </form>
  </div>

  <!-- MÀN HÌNH ĐỔI MẬT KHẨU LẦN ĐẦU (Giữ nguyên) -->
  <div id="hsChangePassBox" class="hidden bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-slate-100">
    <!-- ... (nội dung như cũ) ... -->
  </div>

  <!-- GIAO DIỆN FORM CẬP NHẬT CHI TIẾT (Từ A đến BM) -->
  <div id="hsProfileBox" class="hidden bg-white rounded-2xl shadow-xl p-6 md:p-10 max-w-5xl w-full border border-slate-200 mx-auto">
    <div class="flex justify-between items-center border-b border-slate-200 pb-4 mb-6">
      <div>
        <h2 class="text-xl font-bold text-slate-800">Cập Nhật Hồ Sơ Chi Tiết Học Sinh</h2>
        <p class="text-xs text-emerald-600 font-semibold mt-1" id="hsLopHienThi">Lớp: ---</p>
      </div>
      <button onclick="location.reload()" class="text-xs text-rose-600 bg-rose-50 px-3 py-1.5 rounded-lg hover:bg-rose-100 font-semibold"><i class="fa-solid fa-right-from-bracket"></i> Thoát</button>
    </div>

    <form id="formUpdateProfile" onsubmit="event.preventDefault(); saveStudentProfile();" class="space-y-6">
      
      <!-- PHẦN 1: THÔNG TIN GỐC (KHÓA HOÀN TOÀN) -->
      <!-- ... (nội dung như cũ) ... -->

      <!-- PHẦN 2: NƠI CƯ TRÚ & QUÊ QUÁN (CẬP NHẬT TÁCH CỘT) -->
      <div class="bg-sky-50/50 p-4 rounded-xl border border-sky-100">
        <h3 class="text-sm font-bold text-sky-800 mb-3 uppercase"><i class="fa-solid fa-map-location-dot"></i> 2. Nơi cư trú & Quê quán</h3>
        
        <!-- Chỗ ở hiện nay -->
        <div class="mb-4">
          <h4 class="font-bold text-slate-700 text-xs mb-2 border-b pb-1">Chỗ ở hiện nay</h4>
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 text-xs">
            <div>
              <label class="font-semibold text-slate-600 mb-1 block">SN/Xóm</label>
              <input type="text" id="txtChoOSnXom" class="w-full px-3 py-2 bg-white border rounded-lg">
            </div>
            <div>
              <label class="font-semibold text-slate-600 mb-1 block">Khu dân cư</label>
              <input type="text" id="txtChoOKhuDanCu" class="w-full px-3 py-2 bg-white border rounded-lg">
            </div>
            <div>
              <label class="font-semibold text-slate-600 mb-1 block">Xã/Phường</label>
              <input type="text" id="txtChoOXa" class="w-full px-3 py-2 bg-white border rounded-lg">
            </div>
            <div>
              <label class="font-semibold text-slate-600 mb-1 block">Tỉnh/Tp</label>
              <input type="text" id="txtChoOTinh" class="w-full px-3 py-2 bg-white border rounded-lg">
            </div>
          </div>
        </div>

        <!-- Hộ khẩu thường trú -->
        <div class="mb-4">
          <h4 class="font-bold text-slate-700 text-xs mb-2 border-b pb-1">Hộ khẩu thường trú</h4>
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 text-xs">
            <div>
              <label class="font-semibold text-slate-600 mb-1 block">SN/Xóm</label>
              <input type="text" id="txtHkSnXom" class="w-full px-3 py-2 bg-white border rounded-lg">
            </div>
            <div>
              <label class="font-semibold text-slate-600 mb-1 block">Khu dân cư</label>
              <input type="text" id="txtHkKhuDanCu" class="w-full px-3 py-2 bg-white border rounded-lg">
            </div>
            <div>
              <label class="font-semibold text-slate-600 mb-1 block">Xã/Phường</label>
              <input type="text" id="txtHkXa" class="w-full px-3 py-2 bg-white border rounded-lg">
            </div>
            <div>
              <label class="font-semibold text-slate-600 mb-1 block">Tỉnh/Tp</label>
              <input type="text" id="txtHkTinh" class="w-full px-3 py-2 bg-white border rounded-lg">
            </div>
          </div>
        </div>

        <!-- Nơi sinh -->
        <div class="mb-4">
          <h4 class="font-bold text-slate-700 text-xs mb-2 border-b pb-1">Nơi sinh</h4>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
            <div>
              <label class="font-semibold text-slate-600 mb-1 block">Thông tin nơi sinh</label>
              <input type="text" id="txtNsThongTin" class="w-full px-3 py-2 bg-white border rounded-lg">
            </div>
            <div>
              <label class="font-semibold text-slate-600 mb-1 block">Xã/Phường</label>
              <input type="text" id="txtNsXa" class="w-full px-3 py-2 bg-white border rounded-lg">
            </div>
            <div>
              <label class="font-semibold text-slate-600 mb-1 block">Tỉnh/Tp</label>
              <input type="text" id="txtNsTinh" class="w-full px-3 py-2 bg-white border rounded-lg">
            </div>
          </div>
        </div>

        <!-- Quê quán -->
        <div class="mb-4">
          <h4 class="font-bold text-slate-700 text-xs mb-2 border-b pb-1">Quê quán</h4>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
            <div>
              <label class="font-semibold text-slate-600 mb-1 block">Thông tin quê quán</label>
              <input type="text" id="txtQqThongTin" class="w-full px-3 py-2 bg-white border rounded-lg">
            </div>
            <div>
              <label class="font-semibold text-slate-600 mb-1 block">Xã/Phường</label>
              <input type="text" id="txtQqXa" class="w-full px-3 py-2 bg-white border rounded-lg">
            </div>
            <div>
              <label class="font-semibold text-slate-600 mb-1 block">Tỉnh/Tp</label>
              <input type="text" id="txtQqTinh" class="w-full px-3 py-2 bg-white border rounded-lg">
            </div>
          </div>
        </div>

        <!-- Nơi khai sinh -->
        <div>
          <h4 class="font-bold text-slate-700 text-xs mb-2 border-b pb-1">Nơi khai sinh</h4>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
            <div>
              <label class="font-semibold text-slate-600 mb-1 block">Xã/Phường</label>
              <input type="text" id="txtNksXa" class="w-full px-3 py-2 bg-white border rounded-lg">
            </div>
            <div>
              <label class="font-semibold text-slate-600 mb-1 block">Tỉnh/Tp</label>
              <input type="text" id="txtNksTinh" class="w-full px-3 py-2 bg-white border rounded-lg">
            </div>
          </div>
        </div>
      </div>

      <!-- PHẦN 3: THÔNG TIN CÁ NHÂN & ĐOÀN ĐỘI -->
      <!-- ... (nội dung như cũ) ... -->

      <!-- PHẦN 4: THÔNG TIN GIA ĐÌNH (CHA MẸ) -->
      <!-- ... (nội dung như cũ) ... -->

      <!-- PHẦN 5: LIÊN LẠC & SỨC KHỎE -->
      <!-- ... (nội dung như cũ) ... -->

      <div id="updateMsg" class="hidden p-3 rounded-lg text-xs font-semibold"></div>

      <button type="submit" id="btnSave" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-sm shadow-lg shadow-emerald-600/20 transition">
        💾 GỬI VÀ CẬP NHẬT HỒ SƠ
      </button>
    </form>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzdwituas3YJjOOJsag-gotQomgyKvSw2--L0tiPFMHHkAGduMfIB7ayW9b3s9fiaM8/exec";
    
    // ... (Phần logic xử lý login, change password giữ nguyên) ...

    function loadStudentDataToUI(data, cccdParam) {
      currentStudentCCCD = cccdParam || temporaryCCCD || document.getElementById('loginCCCD').value.trim();
      
      // ... (Phần đổ dữ liệu gốc giữ nguyên) ...

      // Đổ dữ liệu các trường chỉnh sửa được (Cập nhật cho phần địa chỉ)
      document.getElementById('txtChoOSnXom').value = data.choO_SnXom || '';
      document.getElementById('txtChoOKhuDanCu').value = data.choO_KhuDanCu || '';
      document.getElementById('txtChoOXa').value = data.choO_Xa || '';
      document.getElementById('txtChoOTinh').value = data.choO_Tinh || '';
      
      document.getElementById('txtHkSnXom').value = data.hk_SnXom || '';
      document.getElementById('txtHkKhuDanCu').value = data.hk_KhuDanCu || '';
      document.getElementById('txtHkXa').value = data.hk_Xa || '';
      document.getElementById('txtHkTinh').value = data.hk_Tinh || '';
      
      document.getElementById('txtNsThongTin').value = data.ns_ThongTin || '';
      document.getElementById('txtNsXa').value = data.ns_Xa || '';
      document.getElementById('txtNsTinh').value = data.ns_Tinh || '';
      
      document.getElementById('txtQqThongTin').value = data.qq_ThongTin || '';
      document.getElementById('txtQqXa').value = data.qq_Xa || '';
      document.getElementById('txtQqTinh').value = data.qq_Tinh || '';
      
      document.getElementById('txtNksXa').value = data.nks_Xa || '';
      document.getElementById('txtNksTinh').value = data.nks_Tinh || '';
      
      // ... (Phần đổ dữ liệu còn lại giữ nguyên) ...
    }

    async function saveStudentProfile() {
      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.innerHTML = "Đang lưu dữ liệu lên hệ thống...";

      try {
        const payload = {
          action: "updateStudentProfile",
          cccd: currentStudentCCCD, 
          data: {
            choO_SnXom: document.getElementById('txtChoOSnXom').value,
            choO_KhuDanCu: document.getElementById('txtChoOKhuDanCu').value,
            choO_Xa: document.getElementById('txtChoOXa').value,
            choO_Tinh: document.getElementById('txtChoOTinh').value,
            
            hk_SnXom: document.getElementById('txtHkSnXom').value,
            hk_KhuDanCu: document.getElementById('txtHkKhuDanCu').value,
            hk_Xa: document.getElementById('txtHkXa').value,
            hk_Tinh: document.getElementById('txtHkTinh').value,
            
            ns_ThongTin: document.getElementById('txtNsThongTin').value,
            ns_Xa: document.getElementById('txtNsXa').value,
            ns_Tinh: document.getElementById('txtNsTinh').value,
            
            qq_ThongTin: document.getElementById('txtQqThongTin').value,
            qq_Xa: document.getElementById('txtQqXa').value,
            qq_Tinh: document.getElementById('txtQqTinh').value,
            
            nks_Xa: document.getElementById('txtNksXa').value,
            nks_Tinh: document.getElementById('txtNksTinh').value,
            
            // ... (Các trường dữ liệu khác giữ nguyên) ...
          }
        };

        // ... (Phần gửi request và xử lý kết quả giữ nguyên) ...
      } catch (err) {
        // ...
      }
    }
  </script>
</body>
</html>
